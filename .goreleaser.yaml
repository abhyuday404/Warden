version: 2

project_name: warden

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ward
    main: ./cmd/ward
    binary: ward
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/abhyuday404/Warden/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: git
